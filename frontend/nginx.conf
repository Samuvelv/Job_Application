# frontend/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Upload size ────────────────────────────────────────────────────────────
    # Must be at least as large as the per-type limit enforced by Multer (200 MB
    # for videos). Without this directive Nginx defaults to 1 MB and rejects any
    # upload larger than that with HTTP 413 before the request ever reaches Node.
    client_max_body_size  210m;

    # ── Body receive timeout ───────────────────────────────────────────────────
    # Time allowed between two successive read operations from the client body.
    # Default is 60 s — far too short for a slow 200 MB video upload.
    client_body_timeout   300s;

    # Angular HTML5 routing — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell Express the original protocol so req.protocol, secure cookies,
        # and audit logging all reflect the real scheme (http vs https).
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Proxy timeouts for large file uploads (5 minutes each) ────────────
        # Default for all three is 60 s. A slow 200 MB upload easily exceeds
        # 60 s; Nginx would drop the proxied connection mid-stream, causing
        # Multer to write only the bytes received so far — a truncated file.
        proxy_connect_timeout  300s;
        proxy_send_timeout     300s;   # time to transmit request to upstream
        proxy_read_timeout     300s;   # time to receive response from upstream
        send_timeout           300s;   # time between writes to the client
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
